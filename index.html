<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Tic Tac Toe Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
</head>
<body>
    <!-- select box -->
    <div class="select-box">
        <header>Tic Tac Toe</header>
        <div class="content">
            <div class="title">Select game mode:</div>
            <div class="mode-options">
                <button class="single-player">Single Player</button>
                <button class="two-player">Two Players</button>
            </div>
            
            <div class="difficulty-section">
                <div class="title">Select difficulty:</div>
                <div class="difficulty-options">
                    <button class="easy active">Easy</button>
                    <button class="medium">Medium</button>
                    <button class="hard">Hard</button>
                </div>
            </div>
            
            <div class="title">Select which you want to be?</div>
            <div class="options">
                <button class="playerX">Player (X)</button>
                <button class="playerO">Player (O)</button>
            </div>
            
            <div class="theme-section">
                <div class="title">Select theme:</div>
                <div class="theme-options">
                    <button class="theme-btn blue active" data-theme="blue" title="Blue Theme"></button>
                    <button class="theme-btn purple" data-theme="purple" title="Purple Theme"></button>
                    <button class="theme-btn green" data-theme="green" title="Green Theme"></button>
                    <button class="theme-btn dark" data-theme="dark" title="Dark Theme"></button>
                </div>
            </div>
        </div>
    </div> 

    <!-- playboard section -->
    <div class="play-board">
        <div class="details">
            <div class="players">
                <span class="Xturn">X's Turn</span>
                <span class="Oturn">O's Turn</span>
                <div class="slider"></div>
            </div>
            <div class="timer">
                <span>Time: <span id="countdown">10</span>s</span>
            </div>
        </div>
        <div class="play-area">
            <section>
                <span class="box1"></span>
                <span class="box2"></span>
                <span class="box3"></span>
            </section>
            <section>
                <span class="box4"></span>
                <span class="box5"></span>
                <span class="box6"></span>
            </section>
            <section>
                <span class="box7"></span>
                <span class="box8"></span>
                <span class="box9"></span>
            </section>
        </div>
        <div class="game-info">
            <div class="stats">
                <h3>Game Statistics</h3>
                <p>X Wins: <span id="x-wins">0</span></p>
                <p>O Wins: <span id="o-wins">0</span></p>
                <p>Draws: <span id="draws">0</span></p>
                <button id="reset-stats">Reset Stats</button>
            </div>
            <div class="move-history">
                <h3>Move History</h3>
                <ul id="moves-list"></ul>
            </div>
        </div>
    </div>

    <!-- result box -->
    <div class="result-box">
        <div class="won-text"></div>
        <div class="btn-group">
            <button id="replay-btn">Play Again</button>
            <button id="home-btn">Main Menu</button>
        </div>
    </div>

    <!-- Audio elements -->
    <audio id="place-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-game-ball-tap-2073.mp3"></audio>
    <audio id="win-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3"></audio>
    <audio id="draw-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-neutral-game-notification-937.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
